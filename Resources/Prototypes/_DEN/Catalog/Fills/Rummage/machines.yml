- type: entityTable
  id: RummageableVendingMachineGeneric
  table: !type:GroupSelector
    children:
    # Miscellaneous trash
    - !type:NestedSelector
      tableId: RummageableGenericTrash
      weight: 30
    # Spesos
    - !type:NestedSelector
      tableId: RummageableGenericSpesos
      weight: 15
    # Coins
    - !type:NestedSelector
      tableId: TreasureCoinPile
      weight: 10
    # Vermin
    - !type:NestedSelector
      tableId: RummageableGenericVermin
      weight: 3

- type: entityTable
  id: RummageableDisposals
  table: !type:GroupSelector
    children:
    # Food! (big)
    - !type:GroupSelector
      weight: 3
      children:
      - !type:NestedSelector
        tableId: RandomMealTable
      - id: FoodCheese
    # Food! (small)
    - !type:GroupSelector
      weight: 12
      children:
      - !type:NestedSelector
        tableId: RandomAllSodaTable
      - !type:NestedSelector
        tableId: RandomSnackTable
      - !type:NestedSelector
        tableId: RandomFoodSingle
      - id: FoodCheeseSlice
    # Trash
    - !type:GroupSelector
      weight: 25
      children:
      - !type:NestedSelector
        tableId: RummageableGenericTrash
        weight: 15
      - !type:NestedSelector
        tableId: TrashVendingMachineDrinksCommon
        weight: 5
      - !type:NestedSelector
        tableId: GenericTrashItems
        weight: 5
    # Vermin
    - !type:NestedSelector
      tableId: RummageableGenericVermin
      weight: 5
